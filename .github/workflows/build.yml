name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install webui dependencies
        working-directory: sidecar/src/main/webui
        run: yarn install

      - name: Build and test sidecar
        run: mvn -f sidecar/pom.xml verify
