extends: ~/.claude/blog-routing.yaml

# trellis workspace — blog entries published to mdproctor.github.io
# Same routing as soredium: notes → _notes/, articles → _articles/

rules:
  - match:
      project: trellis
    destinations: [personal-notes]
  - match:
      project: trellis
      entry_type: article
    destinations: [personal-articles]
