quarkus.application.name=trellis-sidecar

# Quinoa frontend
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.package-manager=yarn

# Coordinator
trellis.coordinator.enabled=true
trellis.coordinator.window-time-ms=30000
trellis.coordinator.window-count=20
trellis.coordinator.max-conversation-turns=50
trellis.coordinator.max-agent-iterations=3
trellis.coordinator.default-model=claude-sonnet-5
trellis.coordinator.db-path=${user.home}/.trellis/coordinator.db

# Garden engine REST client
quarkus.rest-client.garden-engine.url=http://localhost:8080
quarkus.rest-client.garden-engine.connect-timeout=2000
quarkus.rest-client.garden-engine.read-timeout=10000
